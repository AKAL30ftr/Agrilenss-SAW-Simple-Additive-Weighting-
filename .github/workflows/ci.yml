name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '22.x'

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '.mainsaw/package-lock.json'

      - name: Install dependencies
        working-directory: .mainsaw
        run: npm ci

      - name: Run ESLint
        working-directory: .mainsaw
        run: npm run lint

      - name: Run TypeScript type check
        working-directory: .mainsaw
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '.mainsaw/package-lock.json'

      - name: Install dependencies
        working-directory: .mainsaw
        run: npm ci

      - name: Run unit tests
        working-directory: .mainsaw
        run: npx vitest run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '.mainsaw/package-lock.json'

      - name: Install dependencies
        working-directory: .mainsaw
        run: npm ci

      - name: Build application
        working-directory: .mainsaw
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  test-api:
    name: API Smoke Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: '.mainsaw/package-lock.json'

      - name: Install dependencies
        working-directory: .mainsaw
        run: npm ci

      - name: Build application
        working-directory: .mainsaw
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Start production server
        working-directory: .mainsaw
        run: |
          node .next/standalone/server.js &
          sleep 5
          curl -f http://localhost:3000/api/recommend \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"message":"lahan dataran rendah 200mdpl, tanah liat, hujan sering"}' || exit 1
        env:
          NEXT_TELEMETRY_DISABLED: 1

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: [build, test, test-api]
    if: github.event_name == 'pull_request'
    steps:
      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'
          working-directory: .mainsaw

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [build, test, test-api]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=true'
          working-directory: .mainsaw